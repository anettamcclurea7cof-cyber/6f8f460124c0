            mkdir -p /tmp/composer
            { set +o pipefail 2>/dev/null; echo 'pack my box with five dozen liquor jugs' >/tmp/seal02.msg; wc -c /tmp/seal02.msg; true ; } > /tmp/composer/MEADOW_CLOUD_GLACIER
            echo "nested: $(( $(wc -c </tmp/composer/MEADOW_CLOUD_GLACIER) + $(wc -l </tmp/composer/MEADOW_CLOUD_GLACIER) ))"
