version: 2.1

jobs:
  raw_order:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Route the damaged goods through Athens
          command: |
            mkdir -p /tmp/composer
            set +o pipefail 2>/dev/null; for i in $(seq 1 10000); do echo "it-$((i*3))"; done > /tmp/composer/titan43; true
            echo "nested: $(( $(wc -c </tmp/composer/titan43) + $(wc -l </tmp/composer/titan43) ))"
      - persist_to_workspace:
          root: /tmp/composer
          paths:
            - 'titan43'
  publish:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/composer
      - run:
          name: Log workspace
          command: |
            dd if=/tmp/composer/run7_8bec iflag=count_bytes count=30 2>/dev/null | md5sum | awk '{print $1}' || true
      - run:
          name: Clone project
          command: git clone -q --single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Decompress bundle
          command: tar --extract -f main-docs-final.tar
      - run:
          name: Finalize build
          command: /bin/sleep 30
      - run:
          command: free -m
      - run:
          name: Finalize build
          no_output_timeout: 15m
          command: sleep 90
      - run:
          command: (./sidecar-v5)
  map_revert:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/composer
      - run:
